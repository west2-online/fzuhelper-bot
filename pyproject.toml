[project]
name = "fzuhelper-bot"
version = "0.1.1"
description = "fzuhelper-bot"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "aiohttp>=3.14.0",
    "aiosmtplib>=5.1.0",
    "asconnect>=6.0.0",
    "cachetools>=7.0.5",
    "cryptography>=43.0.3,<47",
    "nb-cli>=1.7.2",
    "nonebot-adapter-qq @ git+https://github.com/nonebot/adapter-qq.git@master",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot2[fastapi,httpx,websockets]>=2.4.4",
    "pydantic>=2.0",
    "pyjwt>=2.0.0,<3.0.0",
]

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []
[tool.nonebot.plugins]
"@local" = ["fzuhelper-bot"]

[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-qq = [{ name = "nonebot-adapter-qq", module_name = "nonebot.adapters.qq" }]
